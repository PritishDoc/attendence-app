<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracking — Attendify</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        .map-container {
            width: 100%;
            height: calc(100vh - 120px);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
        }
        #trackingMap {
            width: 100%;
            height: 100%;
        }
        .map-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(6, 8, 15, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: var(--radius-md);
            z-index: 10;
            min-width: 250px;
        }
        .employee-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 12px;
        }
        .employee-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.2s;
        }
        .employee-item:hover {
            background: var(--surface-2);
        }
        .employee-item .avatar {
            width: 32px;
            height: 32px;
            font-size: 0.8rem;
        }
        .employee-info {
            flex: 1;
        }
        .employee-name {
            font-size: 0.9rem;
            font-weight: 600;
        }
        .employee-meta {
            font-size: 0.75rem;
            color: var(--text-tertiary);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-success);
        }
    </style>
</head>
<body>
<div class="dashboard">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><div class="sidebar-logo">⏱ <span>Attendify</span></div></div>
        <nav class="sidebar-nav">
            <div class="nav-section"><div class="nav-section-title">Overview</div>
                <a href="index.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
            </div>
            <div class="nav-section"><div class="nav-section-title">Management</div>
                <a href="employees.html" class="nav-item"><span class="nav-icon">👥</span> Employees</a>
                <a href="attendance.html" class="nav-item"><span class="nav-icon">📋</span> Attendance</a>
                <a href="tracking.html" class="nav-item active"><span class="nav-icon">🗺️</span> Live Tracking</a>
                <a href="departments.html" class="nav-item"><span class="nav-icon">🏢</span> Departments</a>
                <a href="reports.html" class="nav-item"><span class="nav-icon">📈</span> Reports</a>
            </div>
            <div class="nav-section"><div class="nav-section-title">System</div>
                <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span> Settings</a>
            </div>
        </nav>
        <div class="sidebar-footer"><div class="sidebar-user"><div class="avatar" id="userAvatar">CA</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="userName">Admin</div><div class="sidebar-user-role">Company Admin</div></div><button class="btn btn-ghost btn-icon" onclick="Auth.logout()">🚪</button></div></div>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
                <div class="topbar-title">Live Tracking</div>
            </div>
        </div>

        <div class="page-content" style="padding-top: 24px;">
            <div class="map-container">
                <div id="trackingMap"></div>
                <div class="map-overlay">
                    <h3 style="font-size: 1.1rem; margin-bottom: 4px;">Active Field Staff</h3>
                    <div class="text-sm text-muted" id="lastUpdated">Updating...</div>
                    <div class="employee-list" id="employeeList">
                        <div class="text-center text-muted" style="padding: 20px;">No employees currently tracking</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAP44kKw0Vf9ZHljyrsUhfM8GA48RlSj-k&callback=initTrackingMap" async defer></script>
<script>
    Auth.requireRole(['company_admin', 'super_admin']);
    populateSidebarUser();

    let map;
    let markers = {};
    let infoWindow;

    window.initTrackingMap = function() {
        map = new google.maps.Map(document.getElementById('trackingMap'), {
            zoom: 12,
            center: { lat: 20.5937, lng: 78.9629 }, // Default India
            disableDefaultUI: true,
            zoomControl: true,
            mapId: 'admin_tracking_map'
        });
        infoWindow = new google.maps.InfoWindow();

        fetchActiveLocations();
        // Poll every 10 seconds
        setInterval(fetchActiveLocations, 10000);
    };

    async function fetchActiveLocations() {
        try {
            const res = await api.get('/tracking/active');
            if (res.success) {
                updateMap(res.data);
                updateList(res.data);
                document.getElementById('lastUpdated').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
            }
        } catch(err) {
            console.error('Failed to fetch tracking data:', err);
        }
    }

    function updateMap(locations) {
        if (!locations || locations.length === 0) return;

        const bounds = new google.maps.LatLngBounds();
        const activeIds = new Set(locations.map(l => l.employee_id));

        // Remove markers for employees no longer active
        for (const id in markers) {
            if (!activeIds.has(Number(id))) {
                markers[id].setMap(null);
                delete markers[id];
            }
        }

        locations.forEach(loc => {
            const pos = { lat: parseFloat(loc.latitude), lng: parseFloat(loc.longitude) };
            
            if (markers[loc.employee_id]) {
                // Update existing marker
                markers[loc.employee_id].setPosition(pos);
            } else {
                // Create new marker
                const marker = new google.maps.Marker({
                    position: pos,
                    map: map,
                    title: loc.name,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 10,
                        fillColor: loc.attendance_type === 'field' ? '#f59e0b' : '#3b82f6',
                        fillOpacity: 1,
                        strokeColor: '#ffffff',
                        strokeWeight: 2
                    }
                });

                marker.addListener('click', () => {
                    infoWindow.setContent(`
                        <div style="color: black; padding: 5px;">
                            <strong>${loc.name}</strong><br>
                            Type: ${loc.attendance_type}<br>
                            Checked in: ${formatTime(loc.checkin_time)}
                        </div>
                    `);
                    infoWindow.open(map, marker);
                });

                markers[loc.employee_id] = marker;
            }
            bounds.extend(pos);
        });

        // Fit map bounds if this is the first load or we want to keep everyone in view
        // map.fitBounds(bounds);
    }

    function updateList(locations) {
        const listEl = document.getElementById('employeeList');
        if (!locations || locations.length === 0) {
            listEl.innerHTML = '<div class="text-center text-muted" style="padding: 20px;">No employees currently tracking</div>';
            return;
        }

        listEl.innerHTML = locations.map(loc => `
            <div class="employee-item" onclick="focusMarker(${loc.employee_id})">
                <div class="avatar">${getInitials(loc.name)}</div>
                <div class="employee-info">
                    <div class="employee-name">${loc.name}</div>
                    <div class="employee-meta">${loc.department || 'N/A'} • ${formatTime(loc.checkin_time)}</div>
                </div>
                <div class="status-dot"></div>
            </div>
        `).join('');
    }

    function focusMarker(employeeId) {
        if (markers[employeeId]) {
            map.panTo(markers[employeeId].getPosition());
            map.setZoom(16);
            google.maps.event.trigger(markers[employeeId], 'click');
        }
    }
</script>
</body>
</html>
