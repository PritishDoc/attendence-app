<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holidays — Attendify</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><div class="sidebar-logo">⏱ <span>Attendify</span></div></div>
        <nav class="sidebar-nav">
            <div class="nav-section"><div class="nav-section-title">Overview</div><a href="index.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a></div>
            <div class="nav-section"><div class="nav-section-title">Management</div>
                <a href="employees.html" class="nav-item"><span class="nav-icon">👥</span> Employees</a>
                <a href="attendance.html" class="nav-item"><span class="nav-icon">📋</span> Attendance</a>
                <a href="requests.html" class="nav-item"><span class="nav-icon">📩</span> Requests</a>
                <a href="departments.html" class="nav-item"><span class="nav-icon">🏗️</span> Departments</a>
                <a href="designations.html" class="nav-item"><span class="nav-icon">👔</span> Designations</a>
                <a href="reports.html" class="nav-item"><span class="nav-icon">📈</span> Reports</a>
            </div>
            <div class="nav-section"><div class="nav-section-title">System</div><a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span> Settings</a>
                <a href="branches.html" class="nav-item"><span class="nav-icon">🏢</span> Branches</a>
                <a href="holidays.html" class="nav-item active"><span class="nav-icon">🎉</span> Holidays</a>
                <a href="leave-policies.html" class="nav-item"><span class="nav-icon">📄</span> Leave Policies</a>
                <a href="document-types.html" class="nav-item"><span class="nav-icon">📁</span> Document Types</a></div>
        </nav>
        <div class="sidebar-footer"><div class="sidebar-user"><div class="avatar">CA</div><div class="sidebar-user-info"><div class="sidebar-user-name">Admin</div><div class="sidebar-user-role">Company Admin</div></div><button class="btn btn-ghost btn-icon" onclick="Auth.logout()">🚪</button></div></div>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
                <div><div class="topbar-title">Holidays</div><div class="topbar-subtitle">Manage your holidays</div></div>
            </div>
            <div class="topbar-right"><button class="btn btn-primary btn-sm" onclick="openModal('holidayModal');document.getElementById('holidayForm').reset();document.getElementById('holidayEditId').value=''">+ Add Holiday</button></div>
        </div>

        <div class="page-content">
            <div class="grid grid-3" id="holidayGrid"><div class="card text-center" style="padding:48px"><span class="text-muted">Loading...</span></div></div>
        </div>
    </main>
</div>

<div class="modal-backdrop" id="holidayModal">
    <div class="modal" style="max-width:420px">
        <div class="modal-header"><h3 class="modal-title">Holiday</h3><button class="modal-close" onclick="closeModal('holidayModal')">&times;</button></div>
        <form id="holidayForm">
            <input type="hidden" id="holidayEditId">
            <div class="form-group"><label class="form-label">Holiday Name *</label><input type="text" id="holidayName" class="form-control" required></div>
            <div class="form-group"><label class="form-label">Date *</label><input type="date" id="holidayDate" class="form-control" required></div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="closeModal('holidayModal')">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
        </form>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script>
    Auth.requireRole(['company_admin']);
    populateSidebarUser();

    async function loadHolidays() {
        try {
            const res = await api.get('/holidays');
            const grid = document.getElementById('holidayGrid');
            if (res.success && res.data?.length) {
                grid.innerHTML = res.data.map(d => `
                    <div class="card" style="text-align:center;padding:24px">
                        <div style="font-size:2rem;margin-bottom:8px">🎉</div>
                        <h4>${d.name}</h4>
                        <div class="stat-value" style="font-size:1.5rem;margin:8px 0">${d.holiday_date}</div>
                        <div class="flex gap-sm justify-center mt-md">
                            <button class="btn btn-ghost btn-sm" onclick="editHoliday(${d.id},'${encodeURIComponent(d.name)}','${d.holiday_date}')">✏️ Edit</button>
                            <button class="btn btn-ghost btn-sm text-danger" onclick="deleteHoliday(${d.id},'${encodeURIComponent(d.name)}')">🗑️</button>
                        </div>
                    </div>
                `).join('');
            } else {
                grid.innerHTML = '<div class="card text-center" style="padding:48px;grid-column:1/-1"><div class="empty-state"><div class="empty-icon">🎉</div><div class="empty-title">No holidays yet</div><div class="empty-text">Create your first holiday</div></div></div>';
            }
        } catch(err) { console.error(err); }
    }

    document.getElementById('holidayForm').addEventListener('submit', async(e) => {
        e.preventDefault();
        const id = document.getElementById('holidayEditId').value;
        const data = { name: document.getElementById('holidayName').value, holiday_date: document.getElementById('holidayDate').value };
        try {
            if (id) { await api.put(`/holidays/${id}`, data); showToast('Updated', 'success'); }
            else { await api.post('/holidays', data); showToast('Created', 'success'); }
            closeModal('holidayModal');
            loadHolidays();
        } catch(err) { showToast(err.message || 'Error', 'error'); }
    });

    function editHoliday(id, name, date) {
        document.getElementById('holidayEditId').value = id;
        document.getElementById('holidayName').value = decodeURIComponent(name);
        document.getElementById('holidayDate').value = date;
        openModal('holidayModal');
    }

    async function deleteHoliday(id, name) {
        const decodedName = decodeURIComponent(name);
        if (!confirmAction(`Delete holiday "${decodedName}"?`)) return;
        try { await api.delete(`/holidays/${id}`); showToast('Deleted', 'success'); loadHolidays(); } catch(err) { showToast('Error', 'error'); }
    }

    loadHolidays();
</script>
</body>
</html>
