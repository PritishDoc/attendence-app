<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Attendify</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
    <div class="auth-particles" id="particles"></div>

    <div class="auth-page">
        <div class="auth-card" style="max-width:500px">
            <div class="auth-logo">
                <h1>⏱ <span class="gradient-text">Attendify</span></h1>
                <p>Register your company — 14-day free trial</p>
            </div>

            <div id="errorMsg" style="display:none;padding:10px 14px;background:var(--color-danger-bg);border:1px solid rgba(239,68,68,0.2);border-radius:var(--radius-md);color:var(--color-danger);font-size:.85rem;margin-bottom:16px;text-align:center"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="company_name">Company Name</label>
                    <input type="text" id="company_name" name="company_name" class="form-control" placeholder="Acme Technologies" required>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                    <div class="form-group">
                        <label class="form-label" for="name">Your Name</label>
                        <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91-9876543210">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="admin@company.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label" for="address">Office Address (Optional)</label>
                    <input type="text" id="address" name="address" class="form-control" placeholder="123 Business Park, City">
                </div>
                <button type="submit" id="registerBtn" class="btn btn-primary btn-block btn-lg" style="margin-top:8px">Create Account →</button>
            </form>

            <div class="auth-footer" style="margin-top:20px">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script>
        if (Auth.isAuthenticated()) Auth.redirectToDashboard();

        const particlesEl = document.getElementById('particles');
        for (let i = 0; i < 25; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random()*100+'%';
            p.style.animationDuration = (10+Math.random()*20)+'s';
            p.style.animationDelay = Math.random()*15+'s';
            particlesEl.appendChild(p);
        }

        document.getElementById('registerForm').addEventListener('submit', async(e) => {
            e.preventDefault();
            const btn = document.getElementById('registerBtn');
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>';

            try {
                await Auth.register({
                    company_name: document.getElementById('company_name').value,
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    password: document.getElementById('password').value,
                    address: document.getElementById('address').value
                });
            } catch(err) {
                errorMsg.textContent = err.message || 'Registration failed';
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Create Account →';
            }
        });
    </script>
</body>
</html>
