<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Leaves — Attendify</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><div class="sidebar-logo">⏱ <span>Attendify</span></div></div>
        <nav class="sidebar-nav">
            <div class="nav-section"><div class="nav-section-title">Menu</div>
                <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
                <a href="attendance.html" class="nav-item"><span class="nav-icon">📋</span> My Attendance</a>
                <a href="leaves.html" class="nav-item active"><span class="nav-icon">🌴</span> My Leaves</a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="avatar">EM</div>
                <div class="sidebar-user-info"><div class="sidebar-user-name">Employee</div><div class="sidebar-user-role">Employee</div></div>
                <button class="btn btn-ghost btn-icon" onclick="Auth.logout()">🚪</button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
                <div><div class="topbar-title">My Leaves</div><div class="topbar-subtitle">Manage your leave applications and balances</div></div>
            </div>
            <div class="topbar-right">
                <button class="btn btn-primary" onclick="openApplyModal()">+ Apply Leave</button>
            </div>
        </div>

        <div class="page-content">
            <!-- Balances Section -->
            <div class="grid grid-3 mb-xl" id="balancesGrid">
                <!-- Dynamically populated -->
                <div class="text-muted text-center" style="grid-column: span 3">Loading balances...</div>
            </div>

            <div class="grid grid-1">
                <!-- Leave History -->
                <div class="card animate-fade-in-up stagger-2">
                    <div class="card-header"><div class="card-title">Leave History</div></div>
                    <div class="table-wrapper">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Type</th>
                                    <th>Dates</th>
                                    <th>Duration</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="leaveHistory">
                                <tr><td colspan="5" class="text-center text-muted">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Apply Leave Modal -->
<div class="modal" id="applyLeaveModal">
    <div class="modal-content" style="max-width: 500px">
        <div class="modal-header">
            <h3 class="modal-title">Apply for Leave</h3>
            <button class="btn-icon" onclick="closeApplyModal()">✕</button>
        </div>
        <form id="applyLeaveForm" onsubmit="handleApplyLeave(event)">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Leave Type</label>
                    <select class="form-control" name="leave_type" required>
                        <option value="CL">Casual Leave (CL)</option>
                        <option value="SL">Sick Leave (SL)</option>
                        <option value="CO">Comp Off (CO)</option>
                        <option value="EL">Earned Leave (EL)</option>
                        <option value="ML">Maternity Leave (ML)</option>
                        <option value="LOP">Loss of Pay (LOP)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Duration</label>
                    <select class="form-control" name="leave_duration" required>
                        <option value="full_day">Full Day</option>
                        <option value="half_day_start">Half Day (First Half)</option>
                        <option value="half_day_end">Half Day (Second Half)</option>
                    </select>
                </div>
                <div class="grid grid-2" style="gap: 16px;">
                    <div class="form-group">
                        <label class="form-label">Start Date</label>
                        <input type="date" class="form-control" name="start_date" id="start_date" required onchange="checkDateInfo()">
                    </div>
                    <div class="form-group">
                        <label class="form-label">End Date</label>
                        <input type="date" class="form-control" name="end_date" id="end_date" required>
                    </div>
                </div>
                <div id="dateInfoAlert" style="display:none; padding:8px; border-radius:4px; font-size:12px; margin-bottom:16px;"></div>
                <div class="form-group">
                    <label class="form-label">Reason</label>
                    <textarea class="form-control" name="reason" rows="3" required></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" onclick="closeApplyModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Submit Request</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/employee/leaves.js"></script>
<script>
    Auth.requireRole(['employee']);
    populateSidebarUser();
    
    // Setup date constraints
    const today = new Date();
    const maxDate = new Date();
    maxDate.setDate(today.getDate() + 60);
    
    document.getElementById('start_date').max = maxDate.toISOString().split('T')[0];
    document.getElementById('end_date').max = maxDate.toISOString().split('T')[0];
</script>
</body>
</html>
