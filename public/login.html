<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Attendify</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
    <div class="auth-particles" id="particles"></div>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <h1>⏱ <span class="gradient-text">Attendify</span></h1>
                <p>Sign in to your account</p>
            </div>

            <div id="errorMsg" style="display:none;padding:10px 14px;background:var(--color-danger-bg);border:1px solid rgba(239,68,68,0.2);border-radius:var(--radius-md);color:var(--color-danger);font-size:.85rem;margin-bottom:16px;text-align:center"></div>

            <form id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="you@company.com" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required minlength="6">
                </div>
                <button type="submit" id="loginBtn" class="btn btn-primary btn-block btn-lg" style="margin-top:8px">Sign In</button>
            </form>

            <div class="auth-divider">or</div>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Register your company</a>
            </div>

            <div style="margin-top:24px;padding:16px;background:var(--surface-1);border-radius:var(--radius-md);font-size:.8rem;color:var(--text-tertiary)">
                <strong style="color:var(--text-secondary)">Demo Accounts:</strong><br>
                <span style="color:var(--text-secondary)">Super Admin:</span> admin@attendify.com<br>
                <span style="color:var(--text-secondary)">Company Admin:</span> admin@demo.com<br>
                <span style="color:var(--text-secondary)">Employee:</span> priya@demo.com<br>
                <span style="color:var(--text-tertiary)">Password for all: Admin@123</span>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script>
        // Redirect if already logged in
        if (Auth.isAuthenticated()) Auth.redirectToDashboard();

        // Particles
        const particlesEl = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (10 + Math.random() * 20) + 's';
            p.style.animationDelay = Math.random() * 15 + 's';
            p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
            particlesEl.appendChild(p);
        }

        // Login form
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>';

            try {
                await Auth.login(
                    document.getElementById('email').value,
                    document.getElementById('password').value
                );
            } catch (err) {
                errorMsg.textContent = err.message || 'Invalid credentials';
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
